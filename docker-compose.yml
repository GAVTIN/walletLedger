# `docker compose up` starts Postgres, the API (port 3000) and the nightly-job worker.
# Both app containers run migrations on start; an advisory lock makes that safe.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: npx tsx src/server.ts
    environment: &appenv
      DATABASE_URL: postgres://wallet:wallet@db:5432/wallet
      PORT: "3000"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      # LLM: with no key the built-in mock "model" answers (demo mode). Set ANTHROPIC_API_KEY to use a real one.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      WITHDRAWAL_FEE_PAISE: ${WITHDRAWAL_FEE_PAISE:-0}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    command: npx tsx src/jobs/worker.ts
    environment:
      <<: *appenv
      RECON_CRON: ${RECON_CRON:-0 2 * * *}   # nightly at 02:00 Asia/Kolkata; set e.g. "* * * * *" to watch it run
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
